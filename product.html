<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARGIRLS — Product</title>
<meta name="description" content="Shop official STARGIRLS products.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="product-speed.css?v=20260910a">
<link rel="stylesheet" href="product-conversion.css?v=20260910c">
<link rel="stylesheet" href="product-fantasy.css?v=20260910b">
</head>
<body>
<header class="product-header">
  <div class="product-header-left">
    <a class="icon-button" href="index.html#catalog" aria-label="Back to shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </a>
    <a class="icon-button" href="index.html#catalog" aria-label="Search products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
    </a>
  </div>
  <a class="product-wordmark" href="index.html#catalog">STARGIRLS<img class="mark" src="images/brand/stargirls-mark-white.svg" alt=""></a>
  <div class="product-header-right">
    <a class="icon-button" href="help.html" aria-label="Help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-4 3.7-6 7.5-6s6.3 2 7.5 6"/></svg>
    </a>
    <button class="icon-button cart-button" type="button" id="cartOpen" aria-label="Open cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.4 10h9.9l1.7-7H7"/><circle cx="9.5" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg>
      <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>
</header>
<main id="app">
  <div class="loading"><div><h1>LOADING PRODUCT ★</h1><p>Opening your item…</p></div></div>
</main>
<a class="floating-help" href="help.html" aria-label="Help">•••</a>
<footer class="page-footer">© 2026 STARGIRLS · OFFICIAL STORE</footer>
<div class="cart-backdrop" id="cartBackdrop"></div>
<aside class="cart" id="cart" aria-label="Shopping cart">
  <div class="cart-head"><strong>YOUR CART</strong><button type="button" id="cartClose" aria-label="Close cart">×</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>SUBTOTAL</span><span id="cartSubtotal">$0.00</span></div>
    <button class="checkout" id="checkout">CHECKOUT →</button>
    <div class="status" id="checkoutStatus">Taxes and shipping calculated at checkout.</div>
  </div>
</aside>
<script src="product-speed.js?v=20260910a"></script>
<script src="product-memory.js?v=20260910a"></script>
<script src="product-conversion.js?v=20260910c"></script>
<script src="product-rewards.js?v=20260910a"></script>
</body>
</html>
