<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARGIRLS — Product</title>
<meta name="theme-color" content="#faf9f6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0b0b;--paper:#faf9f6;--soft:#f0ede7;--line:#ddd8d0;--purple:#8f5cff;--muted:#706b64}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{min-height:100vh}.topbar{min-height:26px;padding:7px 12px;background:var(--purple);display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:900;letter-spacing:.13em}.header{height:64px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--paper)}.brand{color:var(--ink);font-size:25px;font-weight:950;letter-spacing:-.05em;text-decoration:none}.brand span{color:var(--purple)}.header-actions{display:flex;align-items:center;gap:18px}.header a,.header button{color:var(--ink);border:0;background:none;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.08em;padding:0}.product{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);max-width:1450px;margin:0 auto;min-height:calc(100vh - 90px)}.media{background:var(--soft);border-right:1px solid var(--line);min-width:0}.hero{width:100%;aspect-ratio:1/1.05;object-fit:cover;display:block;background:var(--soft)}.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto;border-top:1px solid var(--line)}.thumbs button{flex:0 0 74px;width:74px;height:88px;padding:0;border:1px solid transparent;background:#eee;overflow:hidden}.thumbs button.active{border-color:var(--ink)}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:48px clamp(22px,5vw,72px) 70px}.back{display:inline-block;margin-bottom:28px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.1em;text-decoration:none}.badge{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted)}h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.055em;margin:12px 0 16px}.price{font-size:15px;font-weight:800;margin-bottom:30px}.option{padding:20px 0;border-top:1px solid var(--line)}.option-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:10px;font-weight:900;letter-spacing:.08em}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{min-height:40px;padding:0 13px;border:1px solid #bfb9b1;background:transparent;color:var(--ink);font:inherit;font-size:11px;font-weight:800}.choice.active{background:var(--ink);color:#fff;border-color:var(--ink)}.choice:disabled{opacity:.3}.qty{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:20px 0;font-size:10px;font-weight:900;letter-spacing:.08em}.qty-control{display:flex;border:1px solid #bfb9b1;align-items:center}.qty-control button{width:40px;height:40px;border:0;background:none;font-size:18px}.qty-control span{min-width:32px;text-align:center;font-size:12px}.add{width:100%;height:56px;border:0;background:var(--ink);color:white;font-weight:900;letter-spacing:.09em;font-size:12px}.add:disabled{opacity:.4}.note{font-size:10px;line-height:1.55;color:var(--muted);margin-top:12px}.error{min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px}.error h1{font-size:44px}.error a{color:var(--ink);font-weight:900}.cart-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:.18s;z-index:40}.cart-backdrop.open{opacity:1;pointer-events:auto}.cart{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:var(--paper);transform:translateX(105%);transition:.2s;z-index:50;display:grid;grid-template-rows:auto 1fr auto;border-left:1px solid var(--line)}.cart.open{transform:none}.cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}.cart-head button{border:0;background:none;font-size:26px}.cart-items{overflow:auto}.cart-line{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:16px;border-bottom:1px solid var(--line)}.cart-thumb{width:74px;height:88px;object-fit:cover;background:var(--soft)}.cart-copy{font-size:11px;line-height:1.45}.cart-copy strong{display:block;margin-bottom:5px}.cart-copy button{border:0;background:none;padding:8px 0 0;font-size:9px;text-decoration:underline}.cart-foot{padding:18px;border-top:1px solid var(--line)}.cart-total{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:12px}.checkout{width:100%;height:52px;border:0;background:var(--ink);color:#fff;font-weight:900}.checkout:disabled{opacity:.4}.status{font-size:10px;color:var(--muted);margin-top:10px}.empty{padding:22px;font-size:12px;color:var(--muted)}
@media(max-width:820px){.header{height:58px}.header .help{display:none}.product{display:block;min-height:0}.media{border-right:0;border-bottom:1px solid var(--line)}.hero{aspect-ratio:1/1.08}.thumbs{padding:8px}.thumbs button{flex-basis:64px;width:64px;height:76px}.info{padding:28px 18px 48px}h1{font-size:48px}.back{margin-bottom:20px}.topbar{font-size:8px}}
</style>
</head>
<body>
<div class="topbar">★ STARGIRLS OFFICIAL STORE ★ MOON + SUN ★</div>
<header class="header"><a class="brand" href="index.html#catalog">STARGIRLS<span>★</span></a><div class="header-actions"><a class="help" href="help.html">HELP</a><button type="button" id="cartOpen">CART (<span id="cartCount">0</span>)</button></div></header>
<main id="app"><div class="error"><div><div class="badge">STARGIRLS</div><h1>LOADING PRODUCT ★</h1><p class="note">Opening your item…</p></div></div></main>
<div class="cart-backdrop" id="cartBackdrop"></div><aside class="cart" id="cart"><div class="cart-head"><strong>YOUR CART</strong><button type="button" id="cartClose">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-foot"><div class="cart-total"><span>SUBTOTAL</span><span id="cartSubtotal">$0.00</span></div><button class="checkout" id="checkout">CHECKOUT →</button><div class="status" id="checkoutStatus">Taxes and shipping calculated at checkout.</div></div></aside>
<script>
(()=>{
'use strict';
const API='https://stargirls.stargirlswoo.workers.dev';
const SNAPSHOT_KEY='stargirls-clicked-product-v1';
const CACHE_KEYS=['stargirls-printful-catalog-v6','stargirls-printful-catalog-v5'];
const q=new URLSearchParams(location.search);
const requestedId=q.get('id')||'';
const requestedPf=Number(q.get('pf')||(/^printful-(\d+)$/.exec(requestedId)?.[1]||0));
const app=document.getElementById('app');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https:\/\//i.test(String(u||''))?String(u):'';
const uniq=a=>[...new Set(a.filter(Boolean))];
let source=null,variants=[],selection={color:'',size:'',qty:1},activeImage=0;
function variantParts(v){const parts=String(v?.name||'').split(' / ').map(x=>x.trim()).filter(Boolean);const color=String(v?.color||'').trim()||(parts.length>=3?parts.at(-2):(parts.length===2?parts[0]:'Default'))||'Default';const size=String(v?.size||'').trim()||(parts.length>=2?parts.at(-1):'One Size')||'One Size';const price=Number(v?.price??v?.retail_price);const sync=Number(v?.printful_sync_variant_id||v?.sync_variant_id||0);const images=[];for(const u of v?.images||[])if(safe(u))images.push(u);for(const u of [v?.image,v?.catalog_image,v?.product?.image])if(safe(u))images.push(u);for(const f of v?.files||[])for(const u of [f?.preview_url,f?.thumbnail_url])if(safe(u))images.push(u);return {...v,color,size,price:Number.isFinite(price)?price:null,printful_sync_variant_id:sync,images:uniq(images)};}
function productImages(){const out=[];for(const u of [source?.thumbnail_url,source?.image_url])if(safe(u))out.push(u);const relevant=selection.color?variants.filter(v=>v.color===selection.color):variants;for(const v of relevant)for(const u of v.images||[])out.push(u);return uniq(out).slice(0,8);}
function currentVariant(){return variants.find(v=>v.color===selection.color&&v.size===selection.size)||null;}
function category(){const n=String(source?.name||'').toLowerCase();return /party\s*(?:till|til)\s*hell|hayati|anew|tee|shirt|hoodie|pullover|sweatshirt/.test(n)?'OFFICIAL STARGIRLS MERCH':'STARGIRLS FASHION';}
function loadSnapshot(){try{const snap=JSON.parse(sessionStorage.getItem(SNAPSHOT_KEY)||'null');if(snap?.source&&Array.isArray(snap.source.variants)&&snap.source.variants.length){const pfOk=!requestedPf||Number(snap.pfid)===requestedPf;const idOk=!requestedId||String(snap.id)===requestedId;if(pfOk&&idOk)return snap.source;}}catch{}for(const key of CACHE_KEYS){try{const raw=JSON.parse(localStorage.getItem(key)||'null');const data=raw?.data||raw;const found=(data?.products||[]).find(p=>Number(p.id)===requestedPf);if(found)return found;}catch{}}return null;}
function prepare(raw){source=raw;variants=(raw?.variants||[]).map(variantParts).filter(v=>Number.isFinite(v.price)&&v.printful_sync_variant_id>0);const colors=uniq(variants.map(v=>v.color));const sizes=uniq(variants.map(v=>v.size));if(colors.length===1)selection.color=colors[0];const possible=selection.color?uniq(variants.filter(v=>v.color===selection.color).map(v=>v.size)):sizes;if(possible.length===1)selection.size=possible[0];activeImage=0;render();}
function render(){const colors=uniq(variants.map(v=>v.color));const sizes=uniq(variants.map(v=>v.size));const availableSizes=new Set(variants.filter(v=>!selection.color||v.color===selection.color).map(v=>v.size));const selected=currentVariant();const prices=variants.map(v=>v.price).filter(Number.isFinite);const price=selected?.price??(prices.length?Math.min(...prices):null);const imgs=productImages();if(activeImage>=imgs.length)activeImage=0;document.title=`${source?.name||'STARGIRLS Product'} — STARGIRLS`;app.innerHTML=`<section class="product"><div class="media">${imgs.length?`<img class="hero" id="hero" src="${esc(imgs[activeImage])}" alt="${esc(source?.name||'STARGIRLS product')}" decoding="async">${imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button type="button" data-img="${i}" class="${i===activeImage?'active':''}"><img src="${esc(u)}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>`:''}`:`<div class="error"><p>PRODUCT IMAGE COMING SOON</p></div>`}</div><div class="info"><a class="back" href="index.html#catalog" id="backLink">← BACK TO SHOP</a><div class="badge">${category()}</div><h1>${esc(source?.name||'STARGIRLS PIECE')}</h1><div class="price">${Number.isFinite(price)?money(price):'AVAILABLE'}</div><div class="option"><div class="option-head"><span>COLOR</span><span>${selection.color?esc(selection.color):'SELECT ONE'}</span></div><div class="choices">${colors.map(c=>`<button class="choice ${selection.color===c?'active':''}" type="button" data-color="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="option"><div class="option-head"><span>SIZE</span><span>${selection.size?esc(selection.size):'SELECT ONE'}</span></div><div class="choices">${sizes.map(s=>`<button class="choice ${selection.size===s?'active':''}" type="button" data-size="${esc(s)}" ${selection.color&&!availableSizes.has(s)?'disabled':''}>${esc(s)}</button>`).join('')}</div></div><div class="qty"><span>QUANTITY</span><div class="qty-control"><button type="button" id="minus">−</button><span>${selection.qty}</span><button type="button" id="plus">+</button></div></div><button class="add" type="button" id="add" ${selected?'':'disabled'}>${selected?'ADD TO CART':'SELECT COLOR + SIZE'}</button><p class="note">Made to order. Double-check your size, color and shipping information before checkout.</p></div></section>`;app.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{activeImage=Number(b.dataset.img)||0;render();});app.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selection.color=b.dataset.color;selection.size='';const ps=uniq(variants.filter(v=>v.color===selection.color).map(v=>v.size));if(ps.length===1)selection.size=ps[0];activeImage=0;render();});app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selection.size=b.dataset.size;render();});document.getElementById('minus').onclick=()=>{selection.qty=Math.max(1,selection.qty-1);render();};document.getElementById('plus').onclick=()=>{selection.qty=Math.min(10,selection.qty+1);render();};document.getElementById('add').onclick=addToCart;document.getElementById('backLink').onclick=e=>{if(history.length>1){e.preventDefault();history.back();}};}
function fail(){app.innerHTML=`<div class="error"><div><div class="badge">STARGIRLS</div><h1>COULDN'T OPEN THIS ITEM</h1><p class="note">The product page didn't load correctly.</p><p><a href="index.html#catalog">← BACK TO SHOP</a></p></div></div>`;}
async function fetchDirect(){if(!requestedPf)return null;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),3000);try{const r=await fetch(`${API}/printful/catalog`,{cache:'default',mode:'cors',signal:controller.signal});if(!r.ok)return null;const data=await r.json();return(data?.products||[]).find(p=>Number(p.id)===requestedPf)||null;}catch{return null;}finally{clearTimeout(timer);}}
function cart(){try{const c=JSON.parse(localStorage.getItem('stargirls-cart')||'[]');return Array.isArray(c)?c:[]}catch{return[];}}
function saveCart(c){localStorage.setItem('stargirls-cart',JSON.stringify(c));renderCart();}
function addToCart(){const v=currentVariant();if(!v)return;const c=cart();const id=requestedId||`printful-${requestedPf}`;const ex=c.find(x=>x.id===id&&x.color===selection.color&&x.size===selection.size);if(ex)ex.quantity=Math.min(10,Number(ex.quantity||0)+selection.qty);else c.push({id,color:selection.color,size:selection.size,sku:v.sku||'',printful_sync_variant_id:Number(v.printful_sync_variant_id||0),quantity:selection.qty});saveCart(c);openCart();}
function renderCart(){const c=cart();document.getElementById('cartCount').textContent=String(c.reduce((n,x)=>n+Number(x.quantity||0),0));let total=0;const box=document.getElementById('cartItems');if(!c.length){box.innerHTML='<div class="empty">YOUR CART IS EMPTY.</div>';document.getElementById('cartSubtotal').textContent=money(0);document.getElementById('checkout').disabled=true;return;}box.innerHTML=c.map((x,i)=>{const local=(x.id===(requestedId||`printful-${requestedPf}`))?variants.find(v=>v.color===x.color&&v.size===x.size):null;const price=Number(local?.price||0);if(price)total+=price*Number(x.quantity||0);const img=local?.images?.[0]||source?.thumbnail_url||'';return`<div class="cart-line">${safe(img)?`<img class="cart-thumb" src="${esc(img)}" alt="">`:'<div class="cart-thumb"></div>'}<div class="cart-copy"><strong>${esc(x.id===(requestedId||`printful-${requestedPf}`)?source?.name||'STARGIRLS ITEM':'STARGIRLS ITEM')}</strong><div>${esc(x.color)} · ${esc(x.size)} · QTY ${Number(x.quantity||0)}</div><button type="button" data-remove="${i}">REMOVE</button></div></div>`;}).join('');box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const next=cart();next.splice(Number(b.dataset.remove),1);saveCart(next);});document.getElementById('cartSubtotal').textContent=total?money(total):'Calculated at checkout';document.getElementById('checkout').disabled=false;}
function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('cartBackdrop').classList.add('open');}
function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('cartBackdrop').classList.remove('open');}
async function checkout(){const c=cart();if(!c.length)return;const btn=document.getElementById('checkout'),status=document.getElementById('checkoutStatus');btn.disabled=true;btn.textContent='OPENING CHECKOUT…';try{const r=await fetch(`${API}/checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:c})});const d=await r.json();if(!r.ok||!d.url)throw new Error(d.error||'Checkout failed');location.assign(d.url);}catch(e){btn.disabled=false;btn.textContent='TRY CHECKOUT AGAIN →';status.textContent=e.message||'Checkout could not open.';}}
document.getElementById('cartOpen').onclick=openCart;document.getElementById('cartClose').onclick=closeCart;document.getElementById('cartBackdrop').onclick=closeCart;document.getElementById('checkout').onclick=checkout;renderCart();const immediate=loadSnapshot();if(immediate)prepare(immediate);else fetchDirect().then(raw=>raw?prepare(raw):fail());
})();
</script>
</body>
</html>
