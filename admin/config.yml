backend:
  name: github
  repo: stargirlswoo/STARGIRLS
  branch: main
  auth_methods: [token]

site_url: https://stargirls.maison
display_url: https://stargirls.maison
media_folder: /images
public_folder: /images

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 84
          width: 2048
          height: 2048

collections:
  - name: cinematic_site
    label: STARGIRLS — SITE IMAGES
    files:
      - name: home
        label: WORLD — Homepage
        file: content/home.json
        format: json
        media_folder: /images/home
        public_folder: /images/home
        fields:
          - name: hero
            label: SCENE 00 — COME WITH US / Homepage Hero
            widget: image
            required: false
            hint: The giant image visitors see first on stargirls.maison.
          - name: hayati
            label: SCENE 02 — HAYATI / Soundtrack Image
            widget: image
            required: false
          - name: juno
            label: SCENE 04 — JUNO Image
            widget: image
            required: false

      - name: about
        label: MOON + SUN — Main Photos
        file: content/about.json
        format: json
        media_folder: /images/about
        public_folder: /images/about
        fields:
          - name: moon
            label: Moon Photo
            widget: image
            required: false
            hint: Changes Moon on the WORLD homepage AND the YOU FOUND US page.
          - name: sun
            label: Sun Photo
            widget: image
            required: false
            hint: Changes Sun on the WORLD homepage AND the YOU FOUND US page.

      - name: shop
        label: SHOP — Current Era
        file: content/shop.json
        format: json
        media_folder: /images/shop
        public_folder: /images/shop
        fields:
          - name: hero
            label: Shop Hero
            widget: image
            required: false
            hint: Large image above the product grid.

      - name: product_media
        label: SHOP — Product Photos
        file: content/product-media.json
        format: json
        media_folder: /images/products
        public_folder: /images/products
        fields:
          - name: products
            label: Product Galleries
            label_singular: Product
            widget: list
            required: false
            summary: "{{fields.name}}"
            hint: These photos control the storefront and product galleries. Printful still controls sizes, variants, checkout, and fulfillment.
            fields:
              - name: name
                label: Product Name
                widget: string
                hint: Use the exact product name shown in the shop.
              - name: printful_product_id
                label: Printful Product ID
                widget: number
                value_type: int
                required: false
                hint: Optional but recommended. This keeps the photos attached even if the product title changes.
              - name: card_image
                label: Main Shop Card Photo
                widget: image
                required: false
                hint: The main image shown on the shop grid and in search.
              - name: gallery
                label: Default Gallery
                label_singular: Photo
                widget: list
                required: false
                fields:
                  - { name: image, label: Photo, widget: image }
              - name: colors
                label: Color Galleries
                label_singular: Color
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Color Name, widget: string, hint: "Match the store color exactly, such as Black or White." }
                  - name: images
                    label: Photos for This Color
                    label_singular: Photo
                    widget: list
                    required: false
                    fields:
                      - { name: image, label: Photo, widget: image }

      - name: music
        label: MUSIC — HAYATI
        file: content/music.json
        format: json
        media_folder: /images/music
        public_folder: /images/music
        fields:
          - name: hero
            label: HAYATI Hero
            widget: image
            required: false
          - name: merch_scene
            label: Wear The Era / Merch Scene
            widget: image
            required: false

      - name: juno
        label: JUNO — Fragrance
        file: content/juno.json
        format: json
        media_folder: /images/juno
        public_folder: /images/juno
        fields:
          - { name: hero, label: "JUNO Hero", widget: image, required: false }
          - { name: product, label: "Main Product Photo", widget: image, required: false }
          - { name: detail, label: "Campaign Detail", widget: image, required: false }
          - { name: mood, label: "Mood Scene", widget: image, required: false }

      - name: anew
        label: ANEW — Archive / Era
        file: content/anew.json
        format: json
        media_folder: /images/anew
        public_folder: /images/anew
        fields:
          - { name: hero, label: "ANEW Hero", widget: image, required: false }
          - { name: cover, label: "ANEW Cover", widget: image, required: false }
          - { name: personal_break, label: "Behind-the-Scenes Candid", widget: image, required: false }
          - name: photos
            label: ANEW Photo Diary
            label_singular: Photo
            widget: list
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: alt, label: Photo Description, widget: string, required: false }
