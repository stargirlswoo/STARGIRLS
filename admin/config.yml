            required: false

          - name: cover
            label: ANEW Cover
            widget: image
            required: false

          - name: personal_break
            label: Behind-the-Scenes Candid
            widget: image
            required: false

          - name: photos
            label: ANEW Photo Diary
            label_singular: Photo
            widget: list
            summary: "{{fields.caption}}"

            fields:
              - name: image
                label: Photo
                widget: image

              - name: caption
                label: Caption
                widget: string
                required: false

              - name: alt
                label: Photo Description
                widget: string
                required: false


